# 實際密碼與密鑰寫在 application-local.properties，那個檔不進 Git，會覆寫這裡的空值
spring.datasource.password=
jwt.secret=

spring.config.import=optional:classpath:application-local.properties

spring.application.name=bookstore

spring.datasource.url=jdbc:postgresql://localhost:5432/bookstore
spring.datasource.username=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 管理員只在這個 email 還不存在時建立一次。帳密寫在 application-local.properties
app.admin.email=
app.admin.password=
# 這個檔以 ISO-8859-1 讀取，中文請用 unicode 跳脫，不要直接寫中文
app.admin.name=\u7BA1\u7406\u54E1

# Order mail is optional. Set spring.mail.host in application-local.properties to send.
# Payment still succeeds when mail is not configured.
