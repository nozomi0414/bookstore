# 實際密碼與密鑰寫在 application-local.properties
spring.datasource.password=
jwt.secret=

spring.config.import=optional:classpath:application-local.properties

spring.application.name=bookstore

spring.datasource.url=jdbc:postgresql://localhost:5432/bookstore
spring.datasource.username=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#帳密寫在 application-local.properties
app.admin.email=
app.admin.password=
app.admin.name=\u7BA1\u7406\u54E1

# Order mail is optional. Set spring.mail.host in application-local.properties to send.
# Payment still succeeds when mail is not configured.
